[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["dimos"]

[project]
name = "dimos-torch"
version = "0.2.1"
description = "DIMOS: DIfferentiable MOlecular Simulator"
authors = [ { name="Henrik Christiansen", email="henrik.christiansen@neclab.eu" },
            { name="Takashi Maruyama", email="takashi.maruyama@neclab.eu" },
            { name="Matheus Ferraz", email="matheus@oncoimmunity.com" },            
            { name="Federico Errica", email="federico.errica@neclab.eu" },
            { name="Viktor Zaverkin", email="viktor.zaverkin@neclab.eu" },
            { name="Makoto Takamoto", email="makoto.takamoto@neclab.eu" },
            { name="Francesco Alesiani", email="francesco.alesiani@neclab.eu" },
]
readme = "README.md"
keywords = ["simulation", "molecular dynamics", "sampling methods"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"

dependencies = [
    "torch>=2.11.0",
    "ParmEd>=4.2.1",
    "numpy",
]

[project.optional-dependencies]
# development dependency groups
dev = [
    "openmm[cuda13]>=8.1.1",
    "sphinx>=8.1.3",
    "sphinx-rtd-theme>=3.0.1",
    "matplotlib",
]

mace = [
    "mace-torch>=0.3.11",
    "cuequivariance",
    "cuequivariance-torch",
    "cuequivariance-ops-torch-cu13",
]

[project.urls]
"Homepage" = "https://dimos.henrik-christiansen.net"
